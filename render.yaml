# Render service definition for the repomind FastAPI + Inngest backend.
#
# Free tier: 512 MB RAM, sleeps after 15 min idle (~30 s cold start on next hit).
# ChromaDB lives in the container's ephemeral filesystem on the free plan — it
# resets on every redeploy, so re-ingest repos after each deploy.
# (Upgrade to a paid plan + persistent disk if you need durable vectors.)
#
# Default deployment runs on Gemini for both text generation and embeddings:
# no GPU, no cold-starting a 7B model, no Modal credit burn. The Modal/vLLM path
# is still fully supported — see the commented block at the bottom.

services:
  - type: web
    name: repomind-backend
    runtime: python
    plan: free
    region: oregon                # closest to most users; change if needed
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true              # redeploy on push to main
    healthCheckPath: /api/collections
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── Provider defaults for visitors who never open Settings ──────────
      # Both default to "vllm" (Modal) in code; these make Gemini the default.
      - key: LLM_PROVIDER
        value: "gemini"
      - key: EMBED_PROVIDER
        value: "gemini"

      # One Gemini key serves both text-gen and embeddings.
      # Create at https://aistudio.google.com/apikey — paste in Render's UI.
      # Do NOT commit secrets to this file.
      - key: LLM_API_KEY
        sync: false

      # Optional: separate key for embeddings. Falls back to LLM_API_KEY.
      # - key: EMBED_API_KEY
      #   sync: false

      # ── GitHub PAT (public_repo / repo:read scope) ──────────────────────
      - key: GITHUB_TOKEN
        sync: false

      # ── Inngest Cloud signing keys ──────────────────────────────────────
      # From https://app.inngest.com → your app → Manage → Signing Keys.
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false

      # ── Cross-origin: your Vercel frontend URL, no trailing slash ───────
      # e.g. "https://repomind.vercel.app" (comma-separated for multiple).
      - key: CORS_ORIGINS
        sync: false

      # ── Optional: Modal / vLLM path ─────────────────────────────────────
      # To serve self-hosted Qwen2.5-7B + bge-small instead of Gemini, set
      # LLM_PROVIDER and EMBED_PROVIDER to "vllm" above and fill these in.
      # - key: VLLM_API_KEY
      #   sync: false
      # - key: VLLM_BASE_URL
      #   sync: false
      # - key: VLLM_MODEL
      #   value: "Qwen/Qwen2.5-7B-Instruct"
      # - key: QWEN_GENERATE_URL
      #   sync: false
      # - key: EMBED_BASE_URL
      #   sync: false             # must end with /v1
      # - key: EMBED_MODEL
      #   value: "BAAI/bge-small-en-v1.5"

      # ── Optional: override ChromaDB location (default ./chroma_db) ──────
      # - key: CHROMA_DB_PATH
      #   value: "/opt/render/project/src/chroma_db"
